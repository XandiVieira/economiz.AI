# economizai tunnel-proxy Worker.
# Deploy:  wrangler deploy   (from this folder, after `wrangler login`)
#
# The KV namespace is auto-provisioned on first deploy (no id needed here —
# wrangler creates it named after the worker). After deploy, the public URL is
# https://economizai.<your-account-subdomain>.workers.dev

name = "economizai"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# KV namespace binding. `wrangler deploy` will provision it automatically when
# no id is supplied and prompt to add the id back — or run:
#   wrangler kv namespace create TUNNEL
# and paste the returned id below.
[[kv_namespaces]]
binding = "TUNNEL"
id = "88b4616323e74668b5b82063662702dc"
