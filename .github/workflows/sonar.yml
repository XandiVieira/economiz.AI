# Build, run tests with JaCoCo coverage, and push analysis to SonarCloud.
#
# Runs on GitHub-hosted runners (free + unlimited minutes for public repos).
# Tests use H2 in-memory with Flyway disabled (application-test.yaml), so no
# database service is required. Coverage XML lands at
# target/site/jacoco/jacoco.xml and is picked up by the scanner.
name: sonar

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  analyze:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for accurate SCM blame / new-code detection

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test, and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
