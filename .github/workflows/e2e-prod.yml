# Nightly E2E against the live PROD server — ALERT-ONLY quality gate. Same
# self-cleaning Postman "E2E Flow" as e2e-daily.yml (no-5xx probes, scan→confirm→
# purge→delete, randomized @economizaai.app test users), but a failure opens a
# `prod-error` issue instead of invoking the fixer. Prod is never auto-fixed.
name: e2e-prod

on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC = 04:30 America/Sao_Paulo, after the dev run
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # opens the alert issue on failure
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install newman
        run: npm install -g newman
      - name: Run E2E against prod
        id: run
        env:
          BASE_URL: https://economizai-app-prod.onrender.com
          # Prod-specific admin creds (optional — admin steps skip without them).
          # Deliberately NOT the dev E2E_ADMIN_* secrets: those users don't exist on prod.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_PROD_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_PROD_ADMIN_PASSWORD }}
          E2E_QR_PAYLOAD: ${{ secrets.E2E_QR_PAYLOAD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d9p4nctbedkc73e3veb0
          OWNER_ID: tea-d1ijuaumcj7s73918us0
        run: bash .github/scripts/run-e2e.sh
      - name: Upload newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-prod
          path: newman.json
          if-no-files-found: ignore
      - name: Open alert issue
        if: always() && steps.run.outputs.failed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNATURE: ${{ steps.run.outputs.signature }}
          CONTEXT: ${{ steps.run.outputs.context }}
          SOURCE: e2e-prod
        run: python3 .github/scripts/prod_alert.py
