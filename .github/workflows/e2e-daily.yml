# Daily end-to-end quality gate: runs the Postman "E2E Flow" against the live dev
# server. On failure it hands the failing steps + server-side error to the fixer.
name: e2e-daily

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 03:00 America/Sao_Paulo, after the nightly deploy window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      failed: ${{ steps.run.outputs.failed }}
      signature: ${{ steps.run.outputs.signature }}
      context: ${{ steps.run.outputs.context }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install newman
        run: npm install -g newman
      - name: Run E2E
        id: run
        env:
          BASE_URL: https://economiz-ai.onrender.com
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_QR_PAYLOAD: ${{ secrets.E2E_QR_PAYLOAD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d7odp50k1i2s73ep8o5g
          OWNER_ID: tea-d1ijuaumcj7s73918us0
        run: bash .github/scripts/run-e2e.sh
      - name: Upload newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman.json
          if-no-files-found: ignore

  fix:
    needs: e2e
    if: ${{ always() && needs.e2e.outputs.failed == 'true' }}
    uses: ./.github/workflows/autofix.yml
    with:
      source: e2e
      signature: ${{ needs.e2e.outputs.signature }}
      error_context: ${{ needs.e2e.outputs.context }}
    secrets: inherit
