# Auto-deploy to the self-hosted dev server on every push to `development`.
#
# Runs on a self-hosted GitHub Actions runner (label: economizai-dev) on the
# dev machine. Uses the runner's OWN fresh checkout of the pushed commit and
# invokes ci-deploy.ps1 (single script: copies .env, rebuilds, verifies).
# Postgres volume is untouched, so data is preserved.
name: deploy-dev-server

on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: dev-server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, economizai-dev]
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4

      - name: Deploy (copy .env, rebuild, verify health)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci-deploy.ps1 > C:\actions-runner\last-deploy.log 2>&1

      # The deploy log lives only on the box — surface it in the Actions UI so
      # remote sessions can diagnose failures (and the tunnel self-heal) without RDP.
      - name: Show deploy log
        if: always()
        shell: cmd
        run: powershell -NoProfile -Command "Get-Content C:\actions-runner\last-deploy.log -Tail 100"
