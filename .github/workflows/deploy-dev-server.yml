# Auto-deploy to the self-hosted dev server on every push to `development`.
#
# Runs on a self-hosted GitHub Actions runner installed on the dev machine
# (label: economizai-dev). The runner dials OUT to GitHub, so nothing extra is
# exposed on the box. On push it pulls + rebuilds + restarts the app in the
# machine's existing clone (which holds the gitignored .env). The Postgres
# volume is untouched, so data is preserved.
name: deploy-dev-server

on:
  push:
    branches: [development]
  workflow_dispatch:   # manual redeploy button in the Actions tab

concurrency:
  group: dev-server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, economizai-dev]
    steps:
      # Operate on the machine's real clone (has .env), NOT the runner work dir.
      - name: Pull + rebuild + restart in the dev clone
        shell: powershell
        run: |
          $repo = "C:\Users\Xandi\OneDrive\Documents\projects\economiz.AI"
          Set-Location $repo
          docker context use desktop-linux 2>$null
          git fetch origin development
          git merge --ff-only origin/development
          docker compose --profile server up -d --build

      - name: Verify health
        shell: powershell
        run: |
          $ok = $false
          for ($i=0; $i -lt 20; $i++) {
            try {
              $code = (Invoke-WebRequest "http://localhost:8080/actuator/health" -UseBasicParsing -TimeoutSec 8).StatusCode
              if ($code -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 6
          }
          if (-not $ok) { Write-Error "App did not become healthy after deploy"; exit 1 }
          Write-Host "Dev server healthy on new code."
