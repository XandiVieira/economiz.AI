# economizai — local / self-hosted stack
# ========================================
# Two usages from ONE file, controlled by Compose profiles:
#
#   Backend-dev machine (this Mac) — Postgres only, run the app via Maven:
#     docker compose up -d db
#     ./mvnw spring-boot:run
#
#   Server machine (hosts backend for everyone) — full stack:
#     docker compose --profile server up -d --build
#
# Defaults below mirror application.yaml's localhost fallbacks, so it runs
# with no .env. Drop a .env next to this file to override (it's auto-loaded
# and gitignored). Flyway rebuilds the whole schema on first boot — a fresh
# empty volume is all you need.

services:
  db:
    image: postgres:18-alpine
    container_name: economizai-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-economizai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-economizai}
      POSTGRES_DB: economizai
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdir; mount the parent,
      # not /var/lib/postgresql/data (the old <=17 convention), or initdb refuses to run.
      - economizai-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-economizai} -d economizai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # cap container log size so a 24/7 box can't fill the disk (3 x 10MB = 30MB)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    container_name: economizai-app
    profiles: ["server"]            # only starts with: --profile server
    depends_on:
      db:
        condition: service_healthy
    environment:
      # inside the compose network the DB host is the service name `db`
      DATABASE_URL: jdbc:postgresql://db:5432/economizai
      DB_USERNAME: ${DB_USERNAME:-economizai}
      DB_PASSWORD: ${DB_PASSWORD:-economizai}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-not-for-production-must-be-at-least-256-bits-long}
      # add the FE dev machine + the server's own origin here (comma-separated)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-false}
      # profile pics live on a named volume (below) so they survive container
      # rebuilds — /tmp is wiped on every --build redeploy, which silently
      # orphaned the DB key and made avatars "disappear".
      PROFILE_PICTURE_DIR: /data/profile-pics
    volumes:
      - economizai-profilepics:/data/profile-pics
    ports:
      - "8080:10000"                # host 8080 -> container 10000 (Dockerfile port)
    restart: unless-stopped
    # keep more app history on disk (10 x 20MB = 200MB) since this is what you debug
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # Dozzle — local web UI to view / search / follow container logs in real time.
  # http://<server>:9999  (LAN-reachable too). Read-only, no log storage of its own.
  logs:
    image: amir20/dozzle:latest
    container_name: economizai-logs
    profiles: ["server"]
    volumes:
      # read-only access to the Docker socket so it can stream container logs
      - //var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9999:8080"
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      # only show this project's containers, not every container on the host
      DOZZLE_FILTER: "name=economizai-"
    restart: unless-stopped

volumes:
  economizai-pgdata:
  economizai-profilepics: