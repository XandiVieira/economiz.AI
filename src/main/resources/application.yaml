spring:
  application:
    name: economizai
  servlet:
    multipart:
      max-file-size: 6MB     # leaves headroom over the app-level 5MB profile-picture cap
      max-request-size: 8MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/economizai}
    username: ${DB_USERNAME:economizai}
    password: ${DB_PASSWORD:economizai}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:economizai-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000              # access token: 24h
  refresh-expiration: 2592000000    # refresh token: 30d

economizai:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  default-locale: pt
  admin:
    # Comma-separated emails promoted to ROLE_ADMIN on startup (idempotent).
    # The account must already exist (registered via the app); empty = no-op.
    emails: ${ADMIN_EMAILS:}
  privacy:
    k-anonymity: 3
  ingestion:
    sefaz:
      timeout-ms: 30000
      user-agent: "economizai/0.1 (+https://github.com/XandiVieira/economiz.AI)"
      retry:
        # SVRS portal is intermittently flaky (5xx/timeouts). Retry transient
        # failures so the user doesn't have to re-submit. Total attempts =
        # 1 user-triggered + retries; first retry is immediate, the rest wait
        # delay-ms apart (default schedule: 0s, 5s, 5s, 5s). 4xx never retries.
        max-attempts: ${SEFAZ_RETRY_MAX_ATTEMPTS:5}
        delay-ms: ${SEFAZ_RETRY_DELAY_MS:5000}
      svrs:
        # UFs that delegate NFC-e consultation to the SVRS shared portal.
        # Start with RS (proven to work). Other states known to delegate to
        # SVRS (AC, AL, AP, CE, ES, MA, PA, PB, PI, RJ, RN, RO, RR, SC, SE, TO)
        # are worth testing one at a time: submit a real chave, verify the
        # parser extracts items correctly, then add the UF code here.
        # States with their own portal (SP, MG, BA, PE, PR, GO, MT, MS, DF)
        # need a dedicated adapter — the SVRS URL won't serve their cupons.
        states: ${SEFAZ_SVRS_STATES:RS}
  collaborative:
    enabled: true                              # master switch — disables all observation writes/reads
    min-households-for-public: 3               # k-anon: aggregate queries return empty until this many distinct households contributed
    min-observations-per-product-market: 5     # don't show reference price for (product, market) until enough samples
    min-observations-for-community-promo: 10   # don't flag a community promo unless this much baseline exists
    community-promo-threshold-pct: 15          # current price < (median - X%) → community promo
    community-promo-recent-window-days: 7      # last N days = "recent" sample; older rows are baseline
    lookback-days: 90                          # observations older than this are excluded from reference + promo calcs
  categorizer:
    consensus:
      # User category corrections graduate to global truth (+ learned dictionary)
      # once this many distinct households agree on the same product→category.
      # A single household never changes anything globally.
      min-households: ${CONSENSUS_MIN_HOUSEHOLDS:2}
      # A token enters the learned dictionary only if it recurs across at least
      # this many consensus products, with no category disagreement.
      min-token-products: ${CONSENSUS_MIN_TOKEN_PRODUCTS:2}
  ml:
    # Cascade applies ML category/genericName only when true. Currently OFF —
    # the model is still trained + measured (shadow) via the benchmark, but its
    # (unreliable) predictions are not written to products. Flip on once the
    # benchmark's mlCategoryAccuracyPct is good enough.
    category-apply-enabled: ${ML_CATEGORY_APPLY_ENABLED:false}
  personal-promo:
    threshold-pct: 10                          # personal promo if price < (user's own median - X%)
    min-purchases-for-baseline: 3              # need this many prior purchases to detect personal promos
  consumption:
    enabled: true                              # master switch for Phase 3 consumption-intelligence endpoints
    min-purchases-for-prediction: 2            # below this, a product is silently skipped from /predictions
    history-lookback-days: 365                 # window for computing inter-purchase intervals
    running-low-threshold-days: 7              # days-until-runout that flips status to RUNNING_LOW
    ran-out-grace-days: 0                      # tolerance before flipping to RAN_OUT
  preferences:
    enabled: true                              # master switch for Phase 2.6 derived preferences
    min-purchases-per-generic: 5               # below this, a generic is silently skipped (no preference shown)
    must-have-brand-share: 0.85                # top brand >= this fraction of purchases → MUST_HAVE
    preferred-brand-share: 0.60                # top brand in [preferred, mustHave) → PREFERRED
  geo:
    user-agent: "economizai/0.1 (xandivieira@gmail.com)"  # required by Nominatim usage policy
    timeout-ms: 8000
    geocode-interval-ms: 600000                # how often the background geocoder scans pending markets (10 min)
    geocode-initial-delay-ms: 30000            # wait this long after startup before first scan
    geocode-delay-ms: 1100                     # 1.1s between geocode calls — Nominatim policy is 1 req/sec/IP
  merchant:
    classify:
      enabled: ${MERCHANT_CLASSIFY_ENABLED:true}   # CNAE-based supermarket/pharmacy verification (best-effort)
      base-url: ${BRASILAPI_CNPJ_URL:https://brasilapi.com.br/api/cnpj/v1}
      user-agent: "economizai/0.1 (+https://github.com/XandiVieira/economiz.AI)"
      timeout-ms: 8000
      max-attempts: 3                          # in-call retries before giving up (segment stays UNKNOWN)
      interval-ms: 600000                      # how often the background classifier scans unclassified markets (10 min)
      initial-delay-ms: 45000                  # wait after startup before first scan
  notifications:
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}    # turn on once SMTP env vars (host/port/user/pass) are wired in Render
      from: ${EMAIL_FROM:noreply@economiz.ai}
    push:
      expo:
        # Optional bearer token for the Expo Push API. Unauthenticated sends still
        # work for moderate volume; setting this raises rate limits and powers Expo's
        # analytics dashboard. Generate at https://expo.dev → Account → Access Tokens.
        access-token: ${EXPO_ACCESS_TOKEN:}
    # Stub channels — structure only, dispatch records a "not implemented" failure.
    # Wire credentials + the provider call in each *Dispatcher before flipping these on.
    alexa:
      enabled: ${NOTIFICATIONS_ALEXA_ENABLED:false}     # Alexa Skill Messaging / Proactive Events
    sms:
      enabled: ${NOTIFICATIONS_SMS_ENABLED:false}       # Twilio / Zenvia
    whatsapp:
      enabled: ${NOTIFICATIONS_WHATSAPP_ENABLED:false}  # WhatsApp Cloud API (Meta)
    # Background jobs that drive scheduled notification types.
    replenishment:
      interval-ms: ${NOTIFICATIONS_REPLENISHMENT_INTERVAL_MS:21600000}   # every 6h: predict product runout
      initial-delay-ms: 60000
    budget:
      interval-ms: ${NOTIFICATIONS_BUDGET_INTERVAL_MS:21600000}          # every 6h: monthly spend cap check
      initial-delay-ms: 90000
    digest:
      cron: ${NOTIFICATIONS_DIGEST_CRON:0 0 8 * * MON}                   # weekly Monday 08:00
      zone: ${NOTIFICATIONS_DIGEST_ZONE:America/Sao_Paulo}
  profile-picture:
    local-dir: ${PROFILE_PICTURE_DIR:/tmp/economizai/profile-pics}   # dev: local disk. prod: see DEV_NOTES.md
    max-size-mb: 5
  auth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}    # used in password-reset + email-verification links

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus   # health is public; prometheus is for the metrics scraper
      base-path: /actuator
  endpoint:
    health:
      show-details: never    # don't leak DB/disk internals to anyone hitting /actuator/health
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    # SMTP isn't always wired in dev / Render free tier (see DEV_NOTES) and
    # the mail indicator otherwise tries to ping the server every /health
    # call → returns DOWN → uptime monitors + the keep-alive cron see 503.
    # The AuthEmailSender already degrades gracefully when SMTP is missing.
    mail:
      enabled: false

logging:
  level:
    com.relyon.economizai: INFO
    org.springframework.security: WARN
  pattern:
    # MDC tags in brackets: requestId user receipt item. Empty when not in scope.
    # To deep-debug a flow: filter by receipt=<8-char-id> in your log viewer.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [req=%X{requestId:-} user=%X{userId:-} rcpt=%X{receiptId:-} item=%X{itemId:-}] %logger{30} - %msg%n"
