# Dev profile — active by default (spring.profiles.default: dev).
#
# Intentionally thin: every dev value (localhost DB, weak JWT fallback,
# localhost CORS, SMTP off, swagger on) already lives in application.yaml as
# an env-var fallback, so the self-hosted dev server and local Maven runs work
# with no extra setup. Add a key here only when dev needs to DIFFER from the
# shared base rather than just fall back.

economizai:
  categorizer:
    consensus:
      # Short initial delay so the consensus job fires quickly after startup in dev/test.
      # Prod keeps the full 24h gate via CONSENSUS_INITIAL_DELAY_MS env var.
      initial-delay-ms: 120000   # 2 min
  ml:
    # Short initial delays for dev/test; prod uses the 24h/7d defaults.
    auto-promote-initial-delay-ms: 120000   # 2 min
    retrain-initial-delay-ms: 60000         # 1 min (model already trains at @PostConstruct too)
